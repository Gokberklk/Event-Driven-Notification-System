services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP over HTTP

  api:
    build: .
    command: ["/api"]
    environment: &app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notifications?sslmode=disable
      REDIS_ADDR: redis:6379
      # Values below can be overridden from a .env file next to this compose file.
      PROVIDER_URL: ${PROVIDER_URL:-https://webhook.site/a5b6ad94-fd0a-4a9c-b9a0-67169c8556f2}
      RATE_LIMIT_PER_SEC: ${RATE_LIMIT_PER_SEC:-100}
      WORKER_COUNT: ${WORKER_COUNT:-10}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Distributed tracing. Remove to disable; the app runs fine without Jaeger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports: ["8080:8080"]
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }

  worker:
    build: .
    command: ["/worker"]
    environment: *app-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: { condition: service_started }
    restart: on-failure
